name: One-time FAQ reset cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prevent FAQ reset from returning to all categories
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/pages/home.tsx")
          text = path.read_text(encoding="utf-8")
          target = 'setSelectedCategory("all")'
          replacement = 'setSelectedCategory("about")'
          if target not in text:
              raise SystemExit("Expected FAQ reset category was not found; no change made.")
          path.write_text(text.replace(target, replacement, 1), encoding="utf-8")
          print("Updated FAQ reset to About.")
          PY

      - name: Commit homepage change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/home.tsx
          git rm .github/workflows/one-time-faq-reset-about.yml
          git commit -m "Keep homepage FAQ reset on About category"
          git push
