name: One-time FAQ default cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set About as default FAQ category
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/pages/home.tsx")
          text = path.read_text(encoding="utf-8")
          target = '  const [selectedCategory, setSelectedCategory] = useState("all");\n'
          replacement = '  const [selectedCategory, setSelectedCategory] = useState("about");\n'
          if target not in text:
              raise SystemExit("Expected default FAQ category line was not found; no change made.")
          path.write_text(text.replace(target, replacement, 1), encoding="utf-8")
          print("Set About as the default FAQ category.")
          PY

      - name: Commit homepage change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/home.tsx
          git rm .github/workflows/one-time-faq-about-default.yml
          git commit -m "Set About as default homepage FAQ category"
          git push
